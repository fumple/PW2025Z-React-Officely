spring:
  datasource:
    url: jdbc:mysql://${mysql.hostname}:${mysql.port}/${mysql.database}?serverTimezone=UTC
    username: ${mysql.username}
    password: ${mysql.password}

cors:
  origins: ${cors:*}

flatly:
  token: ${officely.flatly.token}

mail:
  from: ${officely.mail.from}
  host: ${officely.mail.host}
  domain-whitelist:
    - ${officely.mail.whitelisteddomain}

parkly:
  base-url: ${officely.parkly.baseurl}
storage:
  location: ${officely.storage.location}
