spring:
  datasource:
    url: jdbc:mysql://localhost:3306/officely?serverTimezone=UTC
    username: officely
    password: officely123
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
    show-sql: false
    generate-ddl: true
    # Hibernate ddl auto (create, create-drop, validate, update)
    hibernate:
      ddl-auto: update
  hateoas:
    use-hal-as-default-json-media-type: true

cors:
  urls: http://localhost:8080,https://editor.swagger.io/
  mappings: /**

flatly:
  token: abc