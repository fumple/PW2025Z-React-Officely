spring:
  datasource:
    url: jdbc:mysql://localhost:3306/officely?serverTimezone=UTC
    username: officely
    password: officely123
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: never

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  hateoas:
    use-hal-as-default-json-media-type: true

cors:
  urls: http://localhost:8080,https://editor.swagger.io/
  mappings: /**