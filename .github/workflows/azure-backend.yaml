name: Upload backend to Azure

on:
  push:
    branches: [ main ]
    paths:
      - "officely-backend/**"
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin
    - name: Build with Maven
      run: mvn -Dmaven.test.skip=true -B package --file pom.xml
      working-directory: officely-backend
    - name: Azure WebApp
      uses: Azure/webapps-deploy@v2.2.17
      with:
        app-name: officelybackend
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: officely-backend/target/*.jar