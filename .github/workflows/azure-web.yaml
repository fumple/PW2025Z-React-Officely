# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# GitHub recommends pinning actions to a commit SHA.
# To get a newer version, you will need to update the SHA.
# You can also reference a tag or branch, but the action may change without warning.

name: Deploy docs and frontend-web to Azure Static Web Apps

env:
  APP_LOCATION: "output" # location of your client code

on:
  push:
    branches: [ main ]
    paths:
      - "docs/swagger/**"
      - "frontend-web/**"
  pull_request:
    paths:
      - "frontend-web/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-frontend-web-for-changes:
    name: Check frontend-web for changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      frontend-web: ${{ steps.filter.outputs.frontend-web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3.0.2
        id: filter
        with:
          filters: |
            frontend-web:
              - 'frontend-web/**'

  check-frontend-web-for-errors:
    name: Check frontend-web code for errors
    needs: check-frontend-web-for-changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.check-frontend-web-for-changes.outputs.frontend-web == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - working-directory: frontend-web
        run: |
          npm ci
          npm run lint
          npm run prettier-check
          npm run build

  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    needs: [check-frontend-web-for-changes, check-frontend-web-for-errors]
    if: |
      always() && github.event_name != 'pull_request' &&
      (needs.check-frontend-web-for-errors.result == 'success' || needs.check-frontend-web-for-errors.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 25
      - name: Cache node modules
        id: cache-npm
        uses: actions/cache@v4
        env:
          cache-name: cache-node-modules
        with:
          # npm cache files are stored in `~/.npm` on Linux/macOS
          path: ~/.npm
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-
      - name: Build frontend-web
        working-directory: frontend-web
        run: |
          npm ci
          npm run build
      - name: Prepare docs for publishing
        working-directory: docs/swagger
        run: |
          mv public.html public.temprename
          mkdir flatly
          cp flatly.html flatly/index.html
          cp flatly.yaml flatly/flatly.yaml
          mkdir fulldocs
          mv *.html fulldocs
          mv *.yaml fulldocs
          cp logo.svg fulldocs/logo.svg
          mv public.temprename index.html
      - name: Combine compiled app
        working-directory: .
        run: |
          mkdir ${{ env.APP_LOCATION }}
          mv frontend-web/dist ${{ env.APP_LOCATION }}/app
          mv docs/swagger/* ${{ env.APP_LOCATION }}/
      - name: Deploy to Azure
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_OFFICELY }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: ${{ env.APP_LOCATION }}
          skip_app_build: true
