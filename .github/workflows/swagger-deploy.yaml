on:
  push:
    paths: 'docs/swagger/**'
    branches:
      - main
  pull_request:
    paths: 'docs/swagger/**'
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    name: Deploy to Cloudflare Pages
    environment: Swagger
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs/swagger --project-name=pw2025-react-officely
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment deployment URLs on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const sha = context.payload.pull_request?.head?.sha || process.env.GITHUB_SHA || '';
            const short = sha.substring(0, 8);
            const base = `https://${short}.pw2025-react-officely.pages.dev`;
            const body = `Deployment preview:\n\n- ${base}/flatly.html\n- ${base}/internal.html`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body
            });