openapi: 3.1.0
info:
  title: Officely - API documentation for Flatly
  version: 0.0.1
  description:  |
    Uses:
    1. view available filters
       - GET /filters
    2.  Make a booking
        1. Find a place to book
            - GET /offices?startDate=...&endDate=...&addr=...&maxDist=1000&sort=...&pageSize=10&pageToken=... -> list of offices with: distance, minPrice, maxPrice
            - GET /offices/{officeId}/offers?startDate=...&endDate=... -> list of offers with availability info, price info and cancellation info
        2. Create or find user
            1. Find user
                - GET /users?email=bob@example.com -> id: string
            2. Create user if not found
                - POST /users {email, firstName, lastName} -> id: string
        3. Create booking
            - POST /users/{userId}/bookings {officeId, offerId} -> bookingId: string
            - GET /users/{userId}/bookings/{bookingId} -> payment info (bank transfer), time left to pay, to cancel
        4. Cancel booking
            - POST /users/{userId}/bookings/{bookingId}/cancel
    3. View bookings
        1. Find user
            - GET /users?email=bob@example.com -> id: string
        2. Fetch booking list
            - GET /users/{id}/bookings -> list of bookings without details of offices and items
            - GET /offices/{officeId} -> office details
            - GET /offices/{officeId}/items/{itemId} -> item details
security: 
  - api_key: []
components:
  responses:
    Unauthorized:
      description: Unauthorized
  securitySchemes:
    api_key:
      type: http
      name: Authorization
      scheme: Bearer
      in: header
  schemas:
    PageSize:
      type: integer
      minimum: 1
      maximum: 50 # TODO: VALIDATE
      examples: [25]
    FilterElement:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
      oneOf: 
        - type: object
          properties: 
            type:
              type: string
              const: "flags"
            flags:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
            min:
              type: integer
            max:
              type: integer
        - type: object
          properties: 
            type:
              type: string
              const: "integer"
            min:
              type: integer
            max:
              type: integer
    FilterSection:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
        elements:
          type: array
          items: 
            $ref: '#/components/schemas/FilterElement'
    Filters:
      type: array
      items: 
        $ref: '#/components/schemas/FilterSection'
    OfficeResource:
      type: object
      required: 
        - id
        - name
        - description
        - address
        - photoUrls
        - contactEmail
        - contactPhone
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        description:
          type: string
        address:
          type: string
        photoUrls:
          type: array
          items:
            type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        _links:
          type: object
          required:
            - self
          properties:
            self:
              type: string
    OfficeSearchQueryDetails:
      type: object
      required: 
        - minPrice
        - maxPrice
        - distance
      properties:
        minPrice:
          type: integer
        maxPrice:
          type: integer
        distance:
          type: integer
    OfficeOffer:
      type: object
      required:
        - id
        - name
        - totalPrice
        - freeCancellationHours
        - paymentHours
        - paymentHoursType
        - properties
        - photoUrls
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        totalPrice:
          type: integer
        freeCancellationHours:
          type: integer
          description:  The number of hours before a reservation starts when a user can cancel it for free
        paymentHours:
          type: integer
          description: "Depending on the paymentHoursType, either the amount of hours for payment after the booking was made, or the payment must be made x hours before the booking starts"
        paymentHoursType:
          type: string
          enum:
            - beforeStart
            - afterBooking
        photoUrls:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: 
            type: string
        _links:
          type: object
          properties:
            accept:
              type: string
              description: "TODO: How?"
    OfficeItemResource:
      type: object
      required:
        - id
        - name
        - description
        - floor
        - room
        - _links
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        building:
          type: string
          description: Only present if office consists of multiple buildings
          examples:
            - "A"
        floor:
          type: string
          examples:
            - "3"
        room:
          type: string
          examples:
            - "311"
        _links:
          type: object
          required:
            - self
          properties:
            self:
              type: string
    UserResource:
      type: object
      required:
        - id
        - email
        - firstName
        - lastName
        - _links
      properties:
        id:
          type: string
          examples:
            - "2056"
        email:
          type: string
          examples:
            - bob.react@example.com
        firstName:
          type: string
          examples:
            - Bob
        lastName:
          type: string
          examples:
            - React
        _links:
          type: object
          required:
            - self
            - update
            - bookings
          properties:
            self:
              type: string
              examples:
                - "/users/2056"
            update:
              type: string
              examples:
                - "/users/2056"
            bookings:
              type: string
              examples:
                - "/users/2056/bookings"
    BookingResource:
      type: object
      required:
        - id
        - officeId
        - itemId
        - offerId
        - status
        - creationDate
        - startDate
        - endDate
        - totalPrice
        - _links
      properties: 
        id:
          type: string
          examples:
            - "R2026"
        officeId:
          type: string
          examples:
            - "O2040"
        itemId:
          type: string
          examples:
          - "I2020"
        offerId:
          type: string
        status:
          type: string
          enum:
            - active
            - cancelledByUser
            - cancelledByStaff
            - upcoming
            - awaitingPayment
            - past
        creationDate:
          type: string
          examples:
            - "2026-01-01T20:40:06Z"
        startDate:
          type: string
          examples:
            - "2026-01-06"
        endDate:
          type: string
          examples:
            - "2026-01-26"
        cancellationReason:
          type: string
        totalPrice:
          type: integer
        paymentInfo:
          type: object
          required:
            - accountNumber
            - receiverName
            - transferTitle
            - dueDate
          properties:
            accountNumber:
              type: string
            receiverName:
              type: string
            transferTitle:
              type: string
            dueDate:
              type: string
              examples:
                - "2026-01-04T20:40:06Z"
        _links:
          type: object
          required:
            - self
            - office
            - item
            - offer
          properties:
            self:
              type: string
            office:
              type: string
            item:
              type: string
            offer:
              type: string
            cancel:
              type: string

tags:
  - name: Filters
    description: This endpoint is used for loading all available filters
  - name: Users
    description: These endpoints are used to find an user, create a new user or edit an existing user
  - name: Finding an office
  - name: Booking an office
  - name: Viewing and managing bookings

paths:
  '/filters':
    get:
      tags: 
        - Filters
      summary: Get a list of all filters
      responses: 
        "200":
          description: Success
          content: # TODO: CREATE AN EXAMPLE RESPONSE
            application/json:
              schema: 
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/Filters'
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                        examples:
                          - '/filters'
        "401":
          $ref: '#/components/responses/Unauthorized'
  '/offices':
    get: # TODO: EXAMPLES?
      tags:
        - Finding an office
      summary: Search for offices
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-26"
        - name: nearAddress
          in: query
          required: true
          schema:
            type: string
        - name: maxDistanceFromAddress
          in: query
          required: true
          schema:
            type: integer
            description: In meters
            examples:
              - 5000
        - name: filter
          in: query
          schema: 
            type: array
            items:
              type: string
              examples:
                - "builtin.price.min:40"
                - "desk.type.standing:true"
        - name: sort
          in: query
          schema:
            type: string
            enum:
            - price
            - distance
            default: distance
        - name: sortDirection
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema:
                type: object
                required: 
                  - _pagination
                  - _links
                  - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: 
                        - office
                        - query
                        - _links
                      properties:
                        office:
                          $ref: '#/components/schemas/OfficeResource'
                        query:
                          $ref: '#/components/schemas/OfficeSearchQueryDetails'
                        _links:
                          type: object
                          required:
                            - offers
                          properties:
                            offers:
                              type: string
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                      prev:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - startDate
                            - endDate
                            - nearAddress
                            - maxDistanceFromAddress
                            - filter
                            - pageSize
                            - pageToken
                          examples:
                            - nearAddress
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The given address was not found
        "401":
          $ref: '#/components/responses/Unauthorized'
  '/offices/{officeId}/offers':
    get: 
      tags: ['Finding an office']
      summary: "Get available items for booking"
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-26"
        - name: filter
          in: query
          schema: 
            type: array
            items:
              type: string
              examples:
                - "builtin.price.min:40"
                - "desk.type.standing:true"
      responses: 
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficeOffer'
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - startDate
                            - endDate
                            - filter
                          examples:
                            - endDate
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The booking period must last at least 1 day
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office was not found
  '/offices/{officeId}/offers/{offerId}/book':
    post: 
      tags: ['Booking an office']
      summary: "Book an office using the offer"
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
        - name: offerId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            examples:
              - "2026-01-26"
      responses: 
        "201":
          description: Created
          headers: 
            Location:
              example: /users/2056/bookings/5
              description: URL to the newly created booking (for example /users/2056/bookings/5)
              schema: 
                type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - userId
                            - startDate
                            - endDate
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The given user does not exist
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office or offer was not found
  '/users':
    get:
      tags: ['Users']
      summary: Get user by email
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          examples:
            - bob.react@example.com
      responses: 
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                required:
                  - users
                  - _links
                properties:
                  users:
                    type: array
                    maxItems: 1
                    minItems: 0
                    items:
                      $ref: '#/components/schemas/UserResource'
                  _links:
                    type: object
                    required:
                      - create
                    properties:
                      create:
                        type: string
                        examples:
                          - /users
        "401":
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: ['Users']
      summary: Create user
      requestBody:
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                email:
                  type: string
                  examples:
                    - bob.react@example.com
                firstName:
                  type: string
                  examples:
                    - Bob
                lastName:
                  type: string
                  examples:
                    - React
      responses: 
        "201":
          description: Created
          headers: 
            Location:
              example: /users/2056
              description: URL to the newly created user (for example /users/2056)
              schema: 
                type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - email
                            - firstName
                            - lastName
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The provided email is not a valid email
        "401":
          $ref: '#/components/responses/Unauthorized'
        "409":
          description: "User with that email already exists"
  '/users/{userId}':
    patch:
      tags: ['Users']
      summary: Change the first name or last name of an user
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 2056
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                firstName:
                  type: string
                lastName:
                  type: string
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - firstName
                            - lastName
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The length of the first name must not exceed 64 characters
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given user was not found
  '/users/{userId}/bookings/{bookingId}':
    get:
      tags: ['Booking an office']
      summary: "View booking status and payment information"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 2056
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 5
      responses:
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/BookingResource'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given user or booking was not found
  '/users/{userId}/bookings':
    get:
      tags: ['Viewing and managing bookings']
      summary: "Get an user's bookings"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 2056
      - name: pageSize
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/PageSize'
      - name: pageToken
        in: query
        schema:
          type: string
      responses:
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - bookings
                  - _pagination
                  - _links
                properties:
                  bookings:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingResource'
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                      prev:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - pageSize
                            - pageToken
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The page size must not be larger than 50
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given user was not found
  '/offices/{officeId}':
    get: 
      tags: ['Viewing and managing bookings']
      summary: "Get office details"
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/OfficeResource'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office was not found
  '/offices/{officeId}/items/{itemId}':
    get: 
      tags: ['Viewing and managing bookings']
      summary: "Get office item details"
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
        - name: itemId
          in: path
          required: true
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/OfficeItemResource'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office or item was not found
  '/offices/{officeId}/offers/{offerId}':
    get: 
      tags: ['Viewing and managing bookings']
      summary: "View offer details"
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
        - name: offerId
          in: path
          required: true
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/OfficeOffer'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office or offer was not found
  '/users/{userId}/bookings/{bookingId}/cancel':
    post:
      tags: ['Viewing and managing bookings']
      summary: "Cancel a booking"
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 2056
      - name: bookingId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 2056
      responses:
        "200":
          description: Success
        "400":
          description: "The booking cannot be cancelled due to business login"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - message
                      properties:
                        type:
                          type: string
                          const: ActionNotAllowed
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - Cancelling a past booking is not allowed
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given user or booking was not found
          