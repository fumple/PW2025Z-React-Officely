openapi: 3.1.0
servers: 
  - url: https://officely-dev.noscorp.pl/mobile
info:
  title: Officely - Internal Mobile API
  version: 1.1.0
components:
  responses:
    Unauthorized:
      description: Unauthorized
  securitySchemes:
    user_auth:
      name: User auth
      type: http
      in: header
      scheme: "Bearer"
  schemas:
    Link:
      type: object
      required:
        - href
      properties:
        href:
          type: string
    PageSize:
      type: integer
      minimum: 1
      maximum: 50 # TODO: VALIDATE
      examples: [25]
    FilterElement:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
      oneOf: 
        - type: object
          properties: 
            type:
              type: string
              const: "flags"
            flags:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
            min:
              type: integer
            max:
              type: integer
    FilterSection:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
        elements:
          type: array
          items: 
            $ref: '#/components/schemas/FilterElement'
    Filters:
      type: array
      items: 
        $ref: '#/components/schemas/FilterSection'
    OfficeResource:
      type: object
      required: 
        - id
        - name
        - description
        - openingHours
        - address
        - coordinates
        - photoUrls
        - contactEmail
        - contactPhone
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        description:
          type: string
        openingHours:
          type: string
        address:
          type: string
        coordinates:
          type: object
          required:
            - lat
            - lon
          properties:
            lat:
              type: number
            lon:
              type: number
        photoUrls:
          type: array
          items:
            type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        _links:
          type: object
          required:
            - self
          properties:
            self:
              $ref: '#/components/schemas/Link'
    OfficeSearchQueryDetails:
      type: object
      required: 
        - minPrice
        - distance
      properties:
        minPrice:
          type: integer
        distance:
          type: integer
    OfficeOffer:
      type: object
      required:
        - id
        - name
        - totalPrice
        - freeCancellationHours
        - paymentHours
        - properties
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        totalPrice:
          type: integer
        freeCancellationHours:
          type: integer
          description:  The number of hours before a reservation starts when a user can cancel it for free
        paymentHours:
          type: integer
          description: "The payment must be made x hours after the booking was made"
        properties:
          type: object
          additionalProperties: 
            type: string
        _links:
          type: object
          required:
            - accept
          properties:
            accept:
              $ref: '#/components/schemas/Link'
              examples:
                - href: "/offices/2056/offers/12/book"
    OfficeOfferWithoutPrice:
      type: object
      required:
        - id
        - name
        - freeCancellationHours
        - paymentHours
        - properties
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        freeCancellationHours:
          type: integer
          description:  The number of hours before a reservation starts when a user can cancel it for free
        paymentHours:
          type: integer
          description: "The payment must be made x hours after the booking was made"
        properties:
          type: object
          additionalProperties: 
            type: string
        _links:
          type: object
          required:
            - self
          properties:
            self:
              $ref: '#/components/schemas/Link'
              examples:
                - href: "/offices/2056/offers/12"
    OfficeItemResource:
      type: object
      required:
        - id
        - name
        - floor
        - room
        - _links
      properties:
        id:
          type: string
        name:
          type: string
        floor:
          type: string
          examples:
            - "3"
        room:
          type: string
          examples:
            - "311"
        _links:
          type: object
          required:
            - self
          properties:
            self:
              $ref: '#/components/schemas/Link'
    UserResource:
      type: object
      required:
        - type
        - id
        - firstName
        - lastName
        - email
        - dateOfBirth
        - nationality
        - phoneNumber
        - isBlocked
        - isAdmin
        - _links
      properties:
        type:
          type: string
          enum:
            - local_customer
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          format: date
          examples:
            - "2025-04-01"
        nationality:
          type: string
          examples:
            - pl
        phoneNumber:
          type: string
          examples:
            - "+48222347211"
        isBlocked:
          type: boolean
          default: false
        _links:
          type: object
          required:
            - self
            - update
            - bookings
          properties:
            self:
              $ref: '#/components/schemas/Link'
              examples:
                - href: "/users/@me"
            update:
              $ref: '#/components/schemas/Link'
              examples:
                - href: "/users/@me"
            bookings:
              $ref: '#/components/schemas/Link'
              examples:
                - href: "/bookings"
    BookingResource:
      type: object
      required:
        - id
        - officeId
        - itemId
        - offerId
        - status
        - creationDate
        - startDate
        - endDate
        - totalPrice
        - paymentInfo
        - _links
      properties: 
        id:
          type: string
          examples:
            - "R2026"
        officeId:
          type: string
          examples:
            - "O2040"
        itemId:
          type: string
          examples:
          - "I2020"
        offerId:
          type: string
        status:
          type: string
          enum:
            - active
            - cancelledByUser
            - cancelledByStaff
        creationDate:
          type: string
          format: date-time
          examples:
            - "2026-01-01T20:40:06Z"
        startDate:
          type: string
          format: date
          examples:
            - "2026-01-06"
        endDate:
          type: string
          format: date
          examples:
            - "2026-01-26"
        cancellationReason:
          type: string
        totalPrice:
          type: integer
        paymentInfo:
          type: object
          required:
            - status
            - accountNumber
            - receiverName
            - transferTitle
            - dueDate
          properties:
            status:
              type: string
              enum:
                - pendingPayment
                - received
                - pendingRefund
                - refunded
                - cancelled
            accountNumber:
              type: string
            receiverName:
              type: string
            transferTitle:
              type: string
            dueDate:
              type: string
              format: date
              examples:
                - "2026-01-04T20:40:06Z"
        _links:
          type: object
          required:
            - self
            - office
            - item
            - offer
          properties:
            self:
              $ref: '#/components/schemas/Link'
            office:
              $ref: '#/components/schemas/Link'
            item:
              $ref: '#/components/schemas/Link'
            offer:
              $ref: '#/components/schemas/Link'
            cancel:
              $ref: '#/components/schemas/Link'
    ParklyParkingSearchResource:
      type: object
      description: Nullability of properties is unknown!
      required:
        - _links
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        city:
          type: string
        streetName:
          type: string
        streetNumber:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        priceForPeriod:
          type: number
        mainImageUrl:
          type: string
        _links:
          type: object
          required:
            - details
          properties:
            details:
              $ref: '#/components/schemas/Link'
    ParklyParkingDetailsResource:
      type: object
      description: Nullability of properties is unknown!
      required:
        - _links
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        country:
          type: string
        city:
          type: string
        postalCode:
          type: string
        streetName:
          type: string
        streetNumber:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        priceForPeriod:
          type: number
        imageUrls:
          type: array
          items:
            type: string
        disabled:
          type: boolean
        ev:
          type: boolean
        big:
          type: boolean
        _links:
          type: object
          required:
            - self
          properties:
            self:
              $ref: '#/components/schemas/Link'
    ParklyBookingResource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        spotId:
          type: string
          format: uuid
        parkingName:
          type: string
        street:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        localId:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        totalCost:
          type: number
        status:
          type: string
          enum:
            - Confirmed
            - Cancelled
            - Completed
            - InProgress
        source:
          type: string
          enum:
            - parkly
            - officely
        disabled:
          type: boolean
        ev:
          type: boolean
        big:
          type: boolean
    ParklyBookingResourceWithLink:
      type: object
      required:
        - _links
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        spotId:
          type: string
          format: uuid
        parkingName:
          type: string
        street:
          type: string
        city:
          type: string
        imageUrl:
          type: string
        localId:
          type: string
        start:
          type: string
          format: date-time
        end:
          type: string
          format: date-time
        totalCost:
          type: number
        status:
          type: string
          enum:
            - Confirmed
            - Cancelled
            - Completed
            - InProgress
        source:
          type: string
          enum:
            - parkly
            - officely
        disabled:
          type: boolean
        ev:
          type: boolean
        big:
          type: boolean
        _links:
          type: object
          required:
            - self
          properties:
            self:
              $ref: '#/components/schemas/Link'
            update:
              $ref: '#/components/schemas/Link'
            cancel:
              $ref: '#/components/schemas/Link'

tags:
  - name: Filters
    description: This endpoint is used for loading all available filters
  - name: Auth
  - name: Finding an office
  - name: Booking an office
  - name: Viewing and managing bookings

paths:
  '/filters':
    get:
      tags: 
        - Filters
      summary: Get a list of all filters
      security: 
        - user_auth: []
      responses: 
        "200":
          description: Success
          content: # TODO: CREATE AN EXAMPLE RESPONSE
            application/json:
              schema: 
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/Filters'
                  _links:
                    type: object
                    properties:
                      self:
                        $ref: '#/components/schemas/Link'
                        examples:
                          - href: '/filters'
        "401":
          $ref: '#/components/responses/Unauthorized'
  '/login':
    post:
      tags: [ Auth ]
      summary: Log in
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - email
                - password
              properties:
                type:
                  type: string
                  enum:
                    - customer
                email:
                  type: string
                  minLength: 1
                  maxLength: 256
                  format: email
                password:
                  type: string
                  minLength: 1
                  maxLength: 64
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - token
                properties: 
                  token:
                    type: string
        "400":
          description: "Invalid username, password, or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - message
                          properties:
                            type:
                              type: string
                              const: AuthError
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Incorrect email or password
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/signup':
    post:
      tags: [ Auth ]
      summary: Create an account
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - firstName
                - lastName
                - email
                - password
                - dateOfBirth
                - nationality
                - phoneNumber
              properties: 
                type:
                  type: string
                  enum:
                    - customer
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 32
                  examples:
                    - Bob
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 32
                  examples:
                    - React
                email:
                  type: string
                  minLength: 1
                  maxLength: 256
                  format: email
                  examples:
                    - bob.react@example.com
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                dateOfBirth:
                  type: string
                  format: date
                  examples:
                    - "2025-04-01"
                nationality:
                  type: string
                  pattern: "^[A-Z]{2}$"
                  examples:
                    - PL
                phoneNumber:
                  type: string
                  pattern: "^\\+[1-9]\\d{1,14}$"
                  examples:
                    - "+48222347211"
      responses: 
        "201":
          description: "Created"
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - type
                                - firstName
                                - lastName
                                - email
                                - password
                              examples:
                                - password
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Password doesn't meet minimum requirements
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/logout':
    post:
      tags: [ Auth ]
      summary: "Log out of the application"
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
        "401":
          description: Unauthorized
  '/resetPasswordEmail':
    post:
      tags: [Auth]
      summary: "Request a password reset email"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 256
                  format: email
              required:
                - email
      responses:
        "201":
          description: "Created"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - email
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/checkResetCode':
    post:
      tags: [Auth]
      summary: "Check reset code"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 256
                  format: email
                code:
                  type: string
                  minLength: 1
                  maxLength: 6
              required:
                - email
                - code
      responses:
        "200":
          description: "Checked successfully, result in content"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - code
                                - email
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Invalid email
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/resetPassword':
    post:
      tags: [Auth]
      summary: "Reset password"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                  minLength: 1
                  maxLength: 256
                  format: email
                code:
                  type: string
                  minLength: 1
                  maxLength: 6
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 64
              required:
                - email
                - code
                - newPassword
      responses:
        "200":
          description: "Saved"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - code
                                - email
                                - newPassword
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Invalid code
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/users/@me':
    get:
      tags: [ Auth ]
      summary: Get current user info
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
    patch:
      tags: [Auth]
      summary: "Modify personal details"
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 32
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 32
                email:
                  type: string
                  minLength: 1
                  maxLength: 256
                  format: email
                password:
                  type: string
                  minLength: 8
                  maxLength: 64
                currentPassword:
                  type: string
                  description: Must be provided if new password is also given
                  minLength: 8
                  maxLength: 64
                nationality:
                  type: string
                  pattern: "^[A-Z]{2}$"
                  examples:
                    - PL
                phoneNumber:
                  type: string
                  pattern: "^\\+[1-9]\\d{1,14}$"
                  examples:
                    - "+48222347211"
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - firstName
                                - lastName
                                - email
                                - password
                                - nationality
                                - phoneNumber
                            message:
                              type: string
                              description: A human readable message
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden  
  '/offices':
    get: # TODO: EXAMPLES?
      tags:
        - Finding an office
      summary: Search for offices
      description: Either nearLat and nearLon or nearAddress must be provided
      security: 
        - user_auth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-26"
        - name: nearLat
          in: query
          required: false
          schema:
            type: number
        - name: nearLon
          in: query
          required: false
          schema:
            type: number
        - name: nearAddress
          in: query
          required: false
          schema:
            type: string
        - name: maxDistanceFromAddress
          in: query
          required: false
          schema:
            type: integer
            description: In meters
            examples:
              - 5000
        - name: minPrice
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: maxPrice
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
        - name: filter
          in: query
          schema: 
            type: array
            items:
              type: string
              examples:
                - "desk.type.standing:true"
        - name: sort
          in: query
          schema:
            type: string
            enum:
            - priceAsc
            - priceDesc
            - distance
            default: distance
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema:
                type: object
                required: 
                  - _pagination
                  - _links
                  - query
                  - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: 
                        - office
                        - query
                        - _links
                      properties:
                        office:
                          $ref: '#/components/schemas/OfficeResource'
                        query:
                          $ref: '#/components/schemas/OfficeSearchQueryDetails'
                        _links:
                          type: object
                          required:
                            - offers
                          properties:
                            offers:
                              $ref: '#/components/schemas/Link'
                  query:
                    type: object
                    required:
                      - minPrice
                      - maxPrice
                    properties:
                      minPrice:
                        type: integer
                      maxPrice:
