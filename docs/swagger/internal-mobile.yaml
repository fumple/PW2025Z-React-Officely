openapi: 3.1.0
info:
  title: Officely - Internal Mobile API
  version: 0.0.1
  description:  |
    Uses:
    1. view available filters
       - GET /filters
    2.  Make a booking
        1. Find a place to book
            - GET /offices?startDate=...&endDate=...&addr=...&maxDist=1000&sort=...&pageSize=10&pageToken=... -> list of offices with: distance, minPrice, maxPrice
            - GET /offices/{officeId}/offers?startDate=...&endDate=... -> list of offers with availability info, price info and cancellation info
        2. Create or find user
            1. Find user
                - GET /users?email=bob@example.com -> id: string
            2. Create user if not found
                - POST /users {email, firstName, lastName} -> id: string
        3. Create booking
            - POST /users/{userId}/bookings {officeId, offerId} -> bookingId: string
            - GET /users/{userId}/bookings/{bookingId} -> payment info (bank transfer), time left to pay, to cancel
        4. Cancel booking
            - POST /users/{userId}/bookings/{bookingId}/cancel
    3. View bookings
        1. Find user
            - GET /users?email=bob@example.com -> id: string
        2. Fetch booking list
            - GET /users/{id}/bookings -> list of bookings without details of offices and items
            - GET /offices/{officeId} -> office details
            - GET /offices/{officeId}/items/{itemId} -> item details
components:
  responses:
    Unauthorized:
      description: Unauthorized
  securitySchemes:
    user_auth:
      name: User auth
      type: http
      in: header
      scheme: "Bearer"
  schemas:
    PageSize:
      type: integer
      minimum: 1
      maximum: 50 # TODO: VALIDATE
      examples: [25]
    FilterElement:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
      oneOf: 
        - type: object
          properties: 
            type:
              type: string
              const: "flags"
            flags:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
            min:
              type: integer
            max:
              type: integer
        - type: object
          properties: 
            type:
              type: string
              const: "integer"
            min:
              type: integer
            max:
              type: integer
    FilterSection:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
        elements:
          type: array
          items: 
            $ref: '#/components/schemas/FilterElement'
    Filters:
      type: array
      items: 
        $ref: '#/components/schemas/FilterSection'
    OfficeResource:
      type: object
      required: 
        - id
        - name
        - description
        - address
        - coordinates
        - photoUrls
        - contactEmail
        - contactPhone
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        description:
          type: string
        address:
          type: string
        coordinates:
          type: object
          required:
            - lat
            - lon
          properties:
            lat:
              type: number
            lon:
              type: number
        photoUrls:
          type: array
          items:
            type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        _links:
          type: object
          required:
            - self
          properties:
            self:
              type: string
    OfficeSearchQueryDetails:
      type: object
      required: 
        - minPrice
        - distance
      properties:
        minPrice:
          type: integer
        distance:
          type: integer
    OfficeOffer:
      type: object
      required:
        - id
        - name
        - totalPrice
        - freeCancellationHours
        - paymentHours
        - paymentHoursType
        - properties
        - photoUrls
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        totalPrice:
          type: integer
        freeCancellationHours:
          type: integer
          description:  The number of hours before a reservation starts when a user can cancel it for free
        paymentHours:
          type: integer
          description: "The payment must be made x hours after the booking was made"
        photoUrls:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: 
            type: string
        _links:
          type: object
          required:
            - accept
          properties:
            accept:
              type: string
              examples:
                - "/offices/2056/offers/12/book"
    OfficeOfferWithoutPrice:
      type: object
      required:
        - id
        - name
        - freeCancellationHours
        - paymentHours
        - paymentHoursType
        - properties
        - photoUrls
        - _links
      properties: 
        id:
          type: string
        name:
          type: string
        freeCancellationHours:
          type: integer
          description:  The number of hours before a reservation starts when a user can cancel it for free
        paymentHours:
          type: integer
          description: "The payment must be made x hours after the booking was made"
        photoUrls:
          type: array
          items:
            type: string
        properties:
          type: object
          additionalProperties: 
            type: string
        _links:
          type: object
          required:
            - self
          properties:
            self:
              type: string
              examples:
                - "/offices/2056/offers/12"
    OfficeItemResource:
      type: object
      required:
        - id
        - name
        - description
        - floor
        - room
        - _links
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        floor:
          type: string
          examples:
            - "3"
        room:
          type: string
          examples:
            - "311"
        _links:
          type: object
          required:
            - self
          properties:
            self:
              type: string
    UserResource:
      type: object
      required:
        - type
        - id
        - firstName
        - lastName
        - email
        - dateOfBirth
        - nationality
        - phoneNumber
        - isBlocked
        - isAdmin
        - _links
      properties:
        type:
          type: string
          enum:
            - local_customer
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          format: date
          examples:
            - "2025-04-01"
        nationality:
          type: string
          examples:
            - pl
        phoneNumber:
          type: string
          examples:
            - "+48222347211"
        isBlocked:
          type: boolean
          default: false
        _links:
          type: object
          required:
            - self
            - update
            - bookings
          properties:
            self:
              type: string
              examples:
                - "/users/2056"
            update:
              type: string
              examples:
                - "/users/2056"
            bookings:
              type: string
              examples:
                - "/users/2056/bookings"
    BookingResource:
      type: object
      required:
        - id
        - officeId
        - itemId
        - offerId
        - status
        - creationDate
        - startDate
        - endDate
        - totalPrice
        - paymentInfo
        - _links
      properties: 
        id:
          type: string
          examples:
            - "R2026"
        officeId:
          type: string
          examples:
            - "O2040"
        itemId:
          type: string
          examples:
          - "I2020"
        offerId:
          type: string
        status:
          type: string
          enum:
            - active
            - cancelledByUser
            - cancelledByStaff
        creationDate:
          type: string
          format: date-time
          examples:
            - "2026-01-01T20:40:06Z"
        startDate:
          type: string
          format: date
          examples:
            - "2026-01-06"
        endDate:
          type: string
          format: date
          examples:
            - "2026-01-26"
        cancellationReason:
          type: string
        totalPrice:
          type: integer
        paymentInfo:
          type: object
          required:
            - status
            - accountNumber
            - receiverName
            - transferTitle
            - dueDate
          properties:
            status:
              type: string
              enum:
                - pendingPayment
                - received
                - pendingRefund
                - refunded
            accountNumber:
              type: string
            receiverName:
              type: string
            transferTitle:
              type: string
            dueDate:
              type: string
              format: date
              examples:
                - "2026-01-04T20:40:06Z"
        _links:
          type: object
          required:
            - self
            - office
            - item
            - offer
          properties:
            self:
              type: string
            office:
              type: string
            item:
              type: string
            offer:
              type: string
            cancel:
              type: string

tags:
  - name: Filters
    description: This endpoint is used for loading all available filters
  - name: Auth
  - name: Finding an office
  - name: Booking an office
  - name: Viewing and managing bookings

paths:
  '/filters':
    get:
      tags: 
        - Filters
      summary: Get a list of all filters
      security: 
        - user_auth: []
      responses: 
        "200":
          description: Success
          content: # TODO: CREATE AN EXAMPLE RESPONSE
            application/json:
              schema: 
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/Filters'
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                        examples:
                          - '/filters'
        "401":
          $ref: '#/components/responses/Unauthorized'
  '/login':
    post:
      tags: [ Auth ]
      summary: Log in
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - email
                - password
              properties:
                type:
                  type: string
                  enum:
                    - customer
                email:
                  type: string
                password:
                  type: string
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - token
                properties: 
                  token:
                    type: string
        "400":
          description: "Invalid username, password, or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - message
                          properties:
                            type:
                              type: string
                              const: AuthError
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Incorrect email or password
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/signup':
    post:
      tags: [ Auth ]
      summary: Create an account
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - firstName
                - lastName
                - email
                - password
                - dateOfBirth
                - nationality
                - phoneNumber
              properties: 
                type:
                  type: string
                  enum:
                    - customer
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                dateOfBirth:
                  type: string
                  examples:
                    - "2025-04-01"
                nationality:
                  type: string
                  examples:
                    - pl
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "201":
          description: "Created"
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - type
                                - firstName
                                - lastName
                                - email
                                - password
                              examples:
                                - password
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Password doesn't meet minimum requirements
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/logout':
    post:
      tags: [ Auth ]
      summary: "Log out of the application"
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
        "401":
          description: Unauthorized
  '/resetPasswordEmail':
    post:
      tags: [Auth]
      summary: "Request a password reset email"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "201":
          description: "Created"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - email
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/resetPassword':
    post:
      tags: [Auth]
      summary: "Reset password"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
              required:
                - email
                - code
                - newPassword
      responses:
        "200":
          description: "Saved"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - code
                                - email
                                - newPassword
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Invalid code
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/users/@me':
    get:
      tags: [ Auth ]
      summary: Get current user info
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
    patch:
      tags: [Auth]
      summary: "Modify personal details"
      description: Modify personal details (Important implementation note! Should also work under /users/{userId} where the userId matches the id of the logged in user)
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                nationality:
                  type: string
                  examples:
                    - pl
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - firstName
                                - lastName
                                - email
                                - password
                                - nationality
                                - phoneNumber
                            message:
                              type: string
                              description: A human readable message
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden  
  '/offices':
    get: # TODO: EXAMPLES?
      tags:
        - Finding an office
      summary: Search for offices
      security: 
        - user_auth: []
      parameters:
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-26"
        - name: nearAddress
          in: query
          required: true
          schema:
            type: string
        - name: maxDistanceFromAddress
          in: query
          required: false
          schema:
            type: integer
            description: In meters
            examples:
              - 5000
        - name: filter
          in: query
          schema: 
            type: array
            items:
              type: string
              examples:
                - "builtin.price.min:40"
                - "desk.type.standing:true"
        - name: sort
          in: query
          schema:
            type: string
            enum:
            - priceAsc
            - priceDesc
            - distance
            default: distance
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema:
                type: object
                required: 
                  - _pagination
                  - _links
                  - query
                  - results
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      required: 
                        - office
                        - query
                        - _links
                      properties:
                        office:
                          $ref: '#/components/schemas/OfficeResource'
                        query:
                          $ref: '#/components/schemas/OfficeSearchQueryDetails'
                        _links:
                          type: object
                          required:
                            - offers
                          properties:
                            offers:
                              type: string
                  query:
                    type: object
                    required:
                      - minPrice
                      - maxPrice
                    properties:
                      minPrice:
                        type: integer
                      maxPrice:
                        type: integer
                      
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                      prev:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - startDate
                            - endDate
                            - nearAddress
                            - maxDistanceFromAddress
                            - filter
                            - pageSize
                            - pageToken
                          examples:
                            - nearAddress
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The given address was not found
        "401":
          $ref: '#/components/responses/Unauthorized'
  '/offices/{officeId}/offers':
    get: 
      tags: ['Finding an office']
      summary: "Get available items for booking"
      security: 
        - user_auth: []
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-26"
        - name: filter
          in: query
          schema: 
            type: array
            items:
              type: string
              examples:
                - "builtin.price.min:40"
                - "desk.type.standing:true"
      responses: 
        "200":
          description: Success
          content: 
            application/json: 
              schema: 
                type: object
                properties:
                  offers:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfficeOffer'
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - startDate
                            - endDate
                            - filter
                          examples:
                            - endDate
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The booking period must last at least 1 day
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office was not found
  '/offices/{officeId}/offers/{offerId}/book':
    post: 
      tags: ['Booking an office']
      summary: "Book an office using the offer"
      security: 
        - user_auth: []
      parameters: 
        - name: officeId
          in: path
          required: true
          schema:
            type: string
        - name: offerId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: query
          required: true
          schema:
            type: string
        - name: startDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-06"
        - name: endDate
          in: query
          required: true
          schema:
            type: string
            format: date
            examples:
              - "2026-01-26"
      responses: 
        "201":
          description: Created
          headers: 
            Location:
              example: /users/2056/bookings/5
              description: URL to the newly created booking (for example /users/2056/bookings/5)
              schema: 
                type: string
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - field
                        - message
                      properties:
                        type:
                          type: string
                          const: ValidationError
                        field:
                          type: string
                          enum:
                            - userId
                            - startDate
                            - endDate
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - The given user does not exist
        "401":
          $ref: '#/components/responses/Unauthorized'
        "404":
          description: The given office or offer was not found
  '/users/{userId}/bookings/{bookingId}':
    get:
      tags: ['Booking an office']
      summary: "View booking status and payment information"
      security: 
        - user_auth: []
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          examples:
            - 2056
      - name: bookingId
        in: path
        required: true
        schema:
