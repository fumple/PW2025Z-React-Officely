openapi: 3.1.0
info:
  title: Officely - Internal Admin API
  version: 0.0.1
components: 
  securitySchemes: 
    user_auth:
      name: User auth
      type: http
      in: header
      scheme: "Bearer"
  schemas: 
    PageSize:
      type: integer
      minimum: 1
      maximum: 50
      examples: [25]
    UserResource:
      type: object
      required:
        - type
        - id
        - firstName
        - lastName
        - email
        - dateOfBirth
        - nationality
        - phoneNumber
        - isBlocked
        - isAdmin
        - _links
      properties:
        type:
          type: string
          enum:
            - admin
            - local_customer
            - flatly_customer
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          examples:
            - "2025-04-01"
        nationality:
          type: string
          examples:
            - pl
        phoneNumber:
          type: string
          examples:
            - "+48222347211"
        isBlocked:
          type: boolean
          default: false
        isAdmin:
          type: boolean
          default: false
          description: If true, then user has pretty much unrestricted access to all endpoints in the API, with the exception of /users/@me endpoints for other users
        _links:
          type: object
          required:
            - self
          properties: 
            self:
              type: string
              examples:
                - /users/2056
            update:
              type: string
              examples:
                - /users/2056
    BookingResource:
      type: object
      required:
        - id
        - userId
        - officeId
        - itemId
        - offerId
        - status
        - creationDate
        - startDate
        - endDate
        - totalPrice
        - _links
      properties: 
        id:
          type: string
          examples:
            - "R2026"
        userId:
          type: string
          examples:
            - "2056"
        officeId:
          type: string
          examples:
            - "O2040"
        itemId:
          type: string
          examples:
          - "I2020"
        offerId:
          type: string
        status:
          type: string
          enum:
            - active
            - cancelledByUser
            - cancelledByStaff
            - upcoming
            - awaitingPayment
            - awaitingRefund
            - past
        creationDate:
          type: string
          examples:
            - "2026-01-01T20:40:06Z"
        startDate:
          type: string
          examples:
            - "2026-01-06"
        endDate:
          type: string
          examples:
            - "2026-01-26"
        cancellationReason:
          type: string
        totalPrice:
          type: integer
        paymentInfo:
          type: object
          required:
            - accountNumber
            - receiverName
            - transferTitle
            - dueDate
          properties:
            accountNumber:
              type: string
            receiverName:
              type: string
            transferTitle:
              type: string
            dueDate:
              type: string
              examples:
                - "2026-01-04T20:40:06Z"
        _links:
          type: object
          required:
            - self
            - office
            - item
            - offer
          properties:
            self:
              type: string
            user:
              type: string
            office:
              type: string
            item:
              type: string
            offer:
              type: string
            cancel:
              type: string
paths:
  '/login':
    post:
      tags: [ Auth ]
      summary: Log in
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - email
                - password
              properties:
                type:
                  type: string
                  enum:
                    - admin
                email:
                  type: string
                password:
                  type: string
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - token
                properties: 
                  token:
                    type: string
        "400":
          description: "Invalid username, password, or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - message
                          properties:
                            type:
                              type: string
                              const: AuthError
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Incorrect email or password
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/signup':
    post:
      tags: [ Auth ]
      summary: Create an account
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - firstName
                - lastName
                - email
                - password
                - dateOfBirth
                - nationality
                - phoneNumber
              properties: 
                type:
                  type: string
                  enum:
                    - admin
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                dateOfBirth:
                  type: string
                  examples:
                    - "2025-04-01"
                nationality:
                  type: string
                  examples:
                    - pl
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "201":
          description: "Created"
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - type
                                - firstName
                                - lastName
                                - email
                                - password
                              examples:
                                - password
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Password doesn't meet minimum requirements
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/logout':
    post:
      tags: [ Auth ]
      summary: "Log out of the application"
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
        "401":
          description: Unauthorized
  '/resetPasswordEmail':
    post:
      tags: [Auth]
      summary: "Request a password reset email"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "201":
          description: "Created"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - email
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/resetPassword':
    post:
      tags: [Auth]
      summary: "Reset password"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
              required:
                - email
                - code
                - newPassword
      responses:
        "200":
          description: "Saved"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - code
                                - email
                                - newPassword
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Invalid code
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/users/@me':
    get:
      tags: [ Auth ]
      summary: Get current user info
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
    patch:
      tags: [Users]
      summary: "Modify personal details"
      description: Modify personal details (Important implementation note! Should also work under /users/{userId} where the userId matches the id of the logged in user)
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                nationality:
                  type: string
                  examples:
                    - pl
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - firstName
                                - lastName
                                - email
                                - password
                                - nationality
                                - phoneNumber
                            message:
                              type: string
                              description: A human readable message
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  '/users':
    get:
      tags: [ Users ]
      summary: "[Admin] Get a list of all users"
      security: 
        - user_auth: []
      parameters: 
        - in: query
          name: filter
          schema:
            type: array
            items:
              type: string
              description: "Currently 'contains' is supported, which is just fieldName:value, also 'equals' is supported with fieldName=:value"
              examples:
                - "id=:2056"
                - "firstName:Bo"
        - in: query
          name: sortField
          schema:
            type: string
            examples:
              - firstName
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                      
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                      prev:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  '/users/{userId}':
    get:
      tags: [ Users ]
      summary: "View info about a given user if the currently logged in user has access (in this case only allow viewing a user's info if they've made a reservation in an office that this user can manage)"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: userId
          required: true
          schema: 
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    patch:
      tags: [Users]
      summary: "[Admin] Modify an user"
      parameters: 
        - in: path
          name: userId
          required: true
          schema: 
            type: string
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                isBlocked:
                  type: boolean
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - isBlocked
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

  '/bookings':
    get:
      tags: [ Bookings ]
      summary: "Get a list of all bookings made for properties owned by the user or for all properties if the user is an admin"
      security: 
        - user_auth: []
      parameters: 
        - in: query
          name: filter
          schema:
            type: array
            items:
              type: string
              description: "Currently 'contains' is supported, which is just fieldName:value, also 'equals' is supported with fieldName=:value"
              examples:
                - "id=:2056"
                - "firstName:Bo"
        - in: query
          name: sortField
          schema:
            type: string
            examples:
              - firstName
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingResource'
                      
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                      prev:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
        "401":
          description: Unauthorized
  '/bookings/{bookingId}':
    get:
      tags: [ Bookings ]
      summary: "View the details of a booking (if the user is allowed to view it)"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: bookingId
          required: true
          schema: 
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/BookingResource'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  '/bookings/{bookingId}/cancel':
    post:
      tags: [ Bookings ]
      summary: "Cancel a booking"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: bookingId
          required: true
          schema: 
            type: string
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - reason
                - withRefund
              properties:
                withRefund:
                  type: boolean
                reason:
                  type: string
      responses: 
        "200":
          description: Success
        "400":
          description: "The booking cannot be cancelled due to business logic"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - type
                        - message
                      properties:
                        type:
                          type: string
                          const: ActionNotAllowed
                        message:
                          type: string
                          description: A human readable message
                          examples:
                            - Cancelling a past booking is not allowed
        "401":
          description: Unauthorized
        "403":
          description: Forbidden