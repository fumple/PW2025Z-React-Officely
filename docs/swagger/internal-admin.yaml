openapi: 3.1.0
info:
  title: Officely - Internal Admin API
  version: 0.0.1
components: 
  securitySchemes: 
    user_auth:
      name: User auth
      type: http
      in: header
      scheme: "Bearer"
  schemas: 
    PageSize:
      type: integer
      minimum: 1
      maximum: 50
      examples: [25]
    UserResource:
      type: object
      required:
        - type
        - id
        - firstName
        - lastName
        - email
        - dateOfBirth
        - nationality
        - phoneNumber
        - isBlocked
        - _links
      properties:
        type:
          type: string
          enum:
            - admin
            - local_customer
            - flatly_customer
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          examples:
            - "2025-04-01"
        nationality:
          type: string
          examples:
            - pl
        phoneNumber:
          type: string
          examples:
            - "+48222347211"
        isBlocked:
          type: boolean
          default: false
        _links:
          type: object
          required:
            - self
          properties: 
            self:
              type: string
              examples:
                - /users/2056
            update:
              type: string
              examples:
                - /users/2056
paths:
  '/login':
    post:
      tags: [ Auth ]
      summary: Log in
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - email
                - password
              properties:
                type:
                  type: string
                  enum:
                    - admin
                email:
                  type: string
                password:
                  type: string
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - token
                properties: 
                  token:
                    type: string
        "400":
          description: "Invalid username, password, or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - message
                          properties:
                            type:
                              type: string
                              const: AuthError
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Incorrect email or password
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/signup':
    post:
      tags: [ Auth ]
      summary: Create an account
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - firstName
                - lastName
                - email
                - password
                - dateOfBirth
                - nationality
                - phoneNumber
              properties: 
                type:
                  type: string
                  enum:
                    - admin
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                dateOfBirth:
                  type: string
                  examples:
                    - "2025-04-01"
                nationality:
                  type: string
                  examples:
                    - pl
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "201":
          description: "Created"
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - type
                                - firstName
                                - lastName
                                - email
                                - password
                              examples:
                                - password
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Password doesn't meet minimum requirements
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/logout':
    post:
      tags: [ Auth ]
      summary: "Log out of the application"
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
        "401":
          description: Unauthorized
  '/users/@me':
    get:
      tags: [ Auth ]
      summary: Get current user info
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
  '/users':
    get:
      tags: [ Users ]
      summary: "[Admin] Get a list of all users"
      security: 
        - user_auth: []
      parameters: 
        - in: query
          name: filter
          schema:
            type: array
            items:
              type: string
              description: "Currently 'contains' is supported, which is just fieldName:value, also 'equals' is supported with fieldName=:value"
              examples:
                - "id=:2056"
                - "firstName:Bo"
        - in: query
          name: sortField
          schema:
            type: string
            examples:
              - firstName
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                      
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        type: string
                      next:
                        type: string
                      prev:
                        type: string
                      first:
                        type: string
                      last:
                        type: string
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  '/users/{userId}':
    get:
      tags: [ Users ]
      summary: "[Admin] Get a list of all users"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: userId
          required: true
          schema: 
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
    patch:
      tags: [Users]
      summary: "[Admin] Modify an user"
      parameters: 
        - in: path
          name: userId
          required: true
          schema: 
            type: string
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                isBlocked:
                  type: boolean
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - isBlocked
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden

          