openapi: 3.1.0
info:
  title: Officely - Internal Admin API
  version: 0.0.1
servers: 
  - url: https://officely-dev.noscorp.pl/admin
  - url: http://localhost:8080/admin
components: 
  securitySchemes: 
    user_auth:
      name: User auth
      type: http
      in: header
      scheme: "Bearer"
  schemas:
    Link:
      type: object
      required:
        - href
      properties:
        href:
          type: string
    PageSize:
      type: integer
      minimum: 1
      maximum: 50
      examples: [25]
    FilterElement:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
      oneOf: 
        - type: object
          properties: 
            type:
              type: string
              const: "flags"
            flags:
              type: array
              items:
                type: object
                properties:
                  key:
                    type: string
                  label:
                    type: string
            min:
              type: integer
            max:
              type: integer
        - type: object
          properties: 
            type:
              type: string
              const: "integer"
            min:
              type: integer
            max:
              type: integer
    FilterSection:
      type: object
      properties: 
        key:
          type: string
        label:
          type: string
        elements:
          type: array
          items: 
            $ref: '#/components/schemas/FilterElement'
    Filters:
      type: array
      items: 
        $ref: '#/components/schemas/FilterSection'
    UserResource:
      type: object
      required:
        - type
        - id
        - firstName
        - lastName
        - email
        - dateOfBirth
        - nationality
        - phoneNumber
        - blocked
        - admin
        - _links
      properties:
        type:
          type: string
          enum:
            - admin
            - local_customer
            - flatly_customer
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        dateOfBirth:
          type: string
          format: date
          examples:
            - "2025-04-01"
        nationality:
          type: string
          examples:
            - pl
        phoneNumber:
          type: string
          examples:
            - "+48222347211"
        blocked:
          type: boolean
          default: false
        admin:
          type: boolean
          default: false
          description: If true, then user has pretty much unrestricted access to all endpoints in the API, with the exception of /users/@me endpoints for other users
        _links:
          type: object
          required:
            - self
          properties: 
            self:
              $ref: '#/components/schemas/Link'
              examples:
                - href: /users/2056
            update:
              $ref: '#/components/schemas/Link'
              examples:
                - href: /users/2056
    BookingResource:
      type: object
      required:
        - id
        - userId
        - officeId
        - itemId
        - offerId
        - status
        - creationDate
        - startDate
        - endDate
        - totalPrice
        - _links
      properties: 
        id:
          type: string
          examples:
            - "R2026"
        userId:
          type: string
          examples:
            - "2056"
        officeId:
          type: string
          examples:
            - "O2040"
        itemId:
          type: string
          examples:
          - "I2020"
        offerId:
          type: string
        status:
          type: string
          enum:
            - active
            - cancelledByUser
            - cancelledByStaff
        creationDate:
          type: string
          format: date-time
          examples:
            - "2026-01-01T20:40:06Z"
        startDate:
          type: string
          format: date
          examples:
            - "2026-01-06"
        endDate:
          type: string
          format: date
          examples:
            - "2026-01-26"
        cancellationReason:
          type: string
        totalPrice:
          type: integer
        paymentInfo:
          type: object
          required:
            - status
            - accountNumber
            - receiverName
            - transferTitle
            - dueDate
          properties:
            status:
              type: string
              enum:
                - pendingPayment
                - received
                - pendingRefund
                - refunded
                - cancelled
            accountNumber:
              type: string
            receiverName:
              type: string
            transferTitle:
              type: string
            dueDate:
              type: string
              format: date
              examples:
                - "2026-01-04T20:40:06Z"
        _links:
          type: object
          required:
            - self
            - office
            - item
            - offer
          properties:
            self:
              $ref: '#/components/schemas/Link'
            user:
              $ref: '#/components/schemas/Link'
            office:
              $ref: '#/components/schemas/Link'
            item:
              $ref: '#/components/schemas/Link'
            offer:
              $ref: '#/components/schemas/Link'
            cancel:
              $ref: '#/components/schemas/Link'
            markPaid:
              $ref: '#/components/schemas/Link'
            markRefunded:
              $ref: '#/components/schemas/Link'
    OfficeResource:
      type: object
      required: 
        - id
        - ownerId
        - name
        - description
        - address
        - coordinates
        - photoUrls
        - contactEmail
        - contactPhone
        - paymentAccountNumber
        - paymentReceiverName
        - _links
      properties: 
        id:
          type: string
        ownerId:
          type: string
        name:
          type: string
        description:
          type: string
        address:
          type: string
        coordinates:
          type: object
          required:
            - lat
            - lon
          properties:
            lat:
              type: number
            lon:
              type: number
        photoUrls:
          type: array
          items:
            type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        published:
          type: boolean
          default: false
        paymentAccountNumber:
          type: string
        paymentReceiverName:
          type: string
        _links:
          type: object
          required:
            - self
            - update
            - offers
            - items
            - members
          properties:
            self:
              $ref: '#/components/schemas/Link'
            update:
              $ref: '#/components/schemas/Link'
            offers:
              $ref: '#/components/schemas/Link'
            items:
              $ref: '#/components/schemas/Link'
            members:
              $ref: '#/components/schemas/Link'
    OfficeOfferResource:
      type: object
      required: 
        - id
        - officeId
        - name
        - pricePerDay
        - pricePerDayCurrency
        - freeCancellationHours
        - paymentHours
        - properties
        - _links
      properties: 
        id:
          type: string
        officeId:
          type: string
        name:
          type: string
        publicName:
          type: string
        pricePerDay:
          type: integer
        pricePerDayCurrency:
          type: string
        freeCancellationHours:
          type: integer
        paymentHours:
          type: integer
          description: The payment must be made x hours after the booking was made
        properties:
          type: object
          additionalProperties: 
            anyOf: 
              - type: string
              - type: boolean
              - type: integer
            
        _links:
          type: object
          required:
            - self
            - office
          properties:
            self:
              $ref: '#/components/schemas/Link'
            office:
              $ref: '#/components/schemas/Link'
    OfficeItemResource:
      type: object
      required: 
        - id
        - officeId
        - name
        - floor
        - room
        - offerId
        - type
        - _links
      properties: 
        id:
          type: string
        officeId:
          type: string
        name:
          type: string
        floor:
          type: string
        room:
          type: string
        offerId:
          type: string
        type:
          type: string
          enum:
            - SHARED
            - INDIVIDUAL
        capacity:
          type: integer
          minimum: 1
          description: Required iff type is shared, otherwise must not be present
        _links:
          type: object
          required:
            - self
            - office
            - offer
          properties:
            self:
              $ref: '#/components/schemas/Link'
            office:
              $ref: '#/components/schemas/Link'
            offer:
              $ref: '#/components/schemas/Link'
    OfficeMemberResource:
      type: object
      required: 
        - id
        - officeId
        - userId
        - _links
      properties: 
        id:
          type: string
        officeId:
          type: string
        userId:
          type: string
        _links:
          type: object
          required:
            - self
            - office
          properties:
            self:
              $ref: '#/components/schemas/Link'
            office:
              $ref: '#/components/schemas/Link'
            delete:
              $ref: '#/components/schemas/Link'
paths:
  '/filters':
    get:
      tags: 
        - Filters
      summary: Get a list of all filters
      responses: 
        "200":
          description: Success
          content: # TODO: CREATE AN EXAMPLE RESPONSE
            application/json:
              schema: 
                type: object
                properties:
                  filters:
                    $ref: '#/components/schemas/Filters'
                  _links:
                    type: object
                    properties:
                      self:
                        $ref: '#/components/schemas/Link'
                        examples:
                          - href: '/filters'
  '/login':
    post:
      tags: [ Auth ]
      summary: Log in
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - email
                - password
              properties:
                type:
                  type: string
                  enum:
                    - admin
                email:
                  type: string
                password:
                  type: string
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - token
                properties: 
                  token:
                    type: string
        "400":
          description: "Invalid username, password, or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - message
                          properties:
                            type:
                              type: string
                              const: AuthError
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Incorrect email or password
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/signup':
    post:
      tags: [ Auth ]
      summary: Create an account
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - type
                - firstName
                - lastName
                - email
                - password
                - dateOfBirth
                - nationality
                - phoneNumber
              properties: 
                type:
                  type: string
                  enum:
                    - admin
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                dateOfBirth:
                  type: string
                  format: date
                  examples:
                    - "2025-04-01"
                nationality:
                  type: string
                  examples:
                    - PL
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "201":
          description: "Created"
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - type
                                - firstName
                                - lastName
                                - email
                                - password
                              examples:
                                - password
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Password doesn't meet minimum requirements
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
  '/logout':
    post:
      tags: [ Auth ]
      summary: "Log out of the application"
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
        "401":
          description: Unauthorized
  '/resetPasswordEmail':
    post:
      tags: [Auth]
      summary: "Request a password reset email"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        "201":
          description: "Created"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - email
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/checkResetCode':
    post:
      tags: [Auth]
      summary: "Check reset code"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
              required:
                - email
                - code
      responses:
        "200":
          description: "Checked successfully, result in content"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - valid
                properties:
                  valid:
                    type: boolean
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - code
                                - email
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Invalid email
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/resetPassword':
    post:
      tags: [Auth]
      summary: "Reset password"
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties:
                email:
                  type: string
                code:
                  type: string
                newPassword:
                  type: string
              required:
                - email
                - code
                - newPassword
      responses:
        "200":
          description: "Saved"
        "400":
          description: "Invalid email or body"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - code
                                - email
                                - newPassword
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Invalid code
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "429":
          description: "Too many requests"
  '/users/@me':
    get:
      tags: [ Auth ]
      summary: Get current user info
      security: 
        - user_auth: []
      responses: 
        "200":
          description: "Success"
          content: 
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
    patch:
      tags: [Users]
      summary: "Modify personal details"
      description: Modify personal details (Important implementation note! Should also work under /users/{userId} where the userId matches the id of the logged in user)
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                firstName:
                  type: string
                lastName:
                  type: string
                email:
                  type: string
                password:
                  type: string
                currentPassword:
                  type: string
                  description: Must be provided if new password is also given
                nationality:
                  type: string
                  examples:
                    - pl
                phoneNumber:
                  type: string
                  examples:
                    - "+48222347211"
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - firstName
                                - lastName
                                - email
                                - password
                                - nationality
                                - phoneNumber
                            message:
                              type: string
                              description: A human readable message
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  '/users':
    get:
      tags: [ Users ]
      summary: "[Admin] Get a list of all users"
      security: 
        - user_auth: []
      parameters: 
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sortField
          schema:
            type: string
            examples:
              - firstName
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: integer
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                type: object
                required:
                  - results
                  - _pagination
                  - _links
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserResource'
                      
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        $ref: '#/components/schemas/Link'
                      next:
                        $ref: '#/components/schemas/Link'
                      prev:
                        $ref: '#/components/schemas/Link'
                      first:
                        $ref: '#/components/schemas/Link'
                      last:
                        $ref: '#/components/schemas/Link'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  '/users/{userId}':
    get:
      tags: [ Users ]
      summary: "View info about a given user if the currently logged in user has access (in this case only allow viewing a user's info if they've made a reservation in an office that this user can manage)"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: userId
          required: true
          schema: 
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/UserResource'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
    patch:
      tags: [Users]
      summary: "[Admin] Modify an user"
      parameters: 
        - in: path
          name: userId
          required: true
          schema: 
            type: string
      security: 
        - user_auth: []
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              properties: 
                blocked:
                  type: boolean
      responses: 
        "204":
          description: Success
        "400":
          description: "Validation error"
          content: 
            application/json: 
              schema: 
                type: object
                required:
                  - errors
                properties:
                  errors:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      oneOf: 
                        - type: object
                          required:
                            - type
                            - field
                            - message
                          properties:
                            type:
                              type: string
                              const: ValidationError
                            field:
                              type: string
                              enum:
                                - blocked
                            message:
                              type: string
                              description: A human readable message
                              examples:
                                - Value must be a boolean
                        - type: object
                          required:
                            - type
                          properties:
                            type:
                              type: string
                              const: InvalidBodyError
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found

  '/bookings':
    get:
      tags: [ Bookings ]
      summary: "Get a list of all bookings made for properties owned by the user or for all properties if the user is an admin"
      security: 
        - user_auth: []
      parameters: 
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: sortField
          schema:
            type: string
            examples:
              - firstName
        - in: query
          name: sortDirection
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: pageSize
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/PageSize'
        - name: pageToken
          in: query
          schema:
            type: integer
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                type: object
                required:
                  - results
                  - _pagination
                  - _links
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookingResource'
                      
                  _pagination:
                    type: object
                    required: 
                      - currentPage
                      - lastPage
                      - pageSize
                    properties:
                      currentPage:
                        type: integer
                      lastPage:
                        type: integer
                      pageSize:
                        type: integer
                  _links:
                    type: object
                    required:
                      - self
                      - first
                      - last
                    properties:
                      self:
                        $ref: '#/components/schemas/Link'
                      next:
                        $ref: '#/components/schemas/Link'
                      prev:
                        $ref: '#/components/schemas/Link'
                      first:
                        $ref: '#/components/schemas/Link'
                      last:
                        $ref: '#/components/schemas/Link'
        "401":
          description: Unauthorized
  '/bookings/{bookingId}':
    get:
      tags: [ Bookings ]
      summary: "View the details of a booking (if the user is allowed to view it)"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: bookingId
          required: true
          schema: 
            type: string
      responses: 
        "200":
          description: Success
          content:
            application/json: 
              schema: 
                $ref: '#/components/schemas/BookingResource'
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
        "404":
          description: Not found
  '/bookings/{bookingId}/cancel':
    post:
      tags: [ Bookings ]
      summary: "Cancel a booking"
      security: 
        - user_auth: []
      parameters: 
        - in: path
          name: bookingId
          required: true
          schema: 
            type: string
      requestBody: 
        required: true
        content: 
          application/json: 
            schema: 
              type: object
              required:
                - reason
